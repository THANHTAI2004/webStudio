services:
  nginx:
    ports: !override
      - "8080:80"
      - "8443:443"

  api:
    environment:
      COOKIE_SECURE: "false"
      SWAGGER_ENABLED: "false"
      SERVE_UPLOADS: "false"

  web:
    build:
      args:
        NEXT_PUBLIC_SITE_URL: http://studio.localhost:8080
    environment:
      NEXT_PUBLIC_SITE_URL: http://studio.localhost:8080
