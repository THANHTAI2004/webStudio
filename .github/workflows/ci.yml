name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://studio_admin:change-me@127.0.0.1:27017/studio_test?authSource=admin
      MONGO_DATABASE: studio_test
      JWT_ACCESS_SECRET: ci-access-secret-at-least-long-enough
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-long-enough
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      UPLOAD_DIR: ../../data/uploads
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      API_INTERNAL_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/admin/package-lock.json
            apps/web/package-lock.json

      - name: Create development compose env
        run: |
          cat > .env <<'EOF'
          MONGO_ROOT_USERNAME=studio_admin
          MONGO_ROOT_PASSWORD=change-me
          MONGO_DATABASE=studio_test
          EOF

      - name: Start MongoDB
        run: docker compose up -d mongodb

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            status="$(docker inspect --format='{{json .State.Health.Status}}' studio_mongodb || true)"
            if [ "$status" = '"healthy"' ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs mongodb
          exit 1

      - name: Install API dependencies
        run: npm --prefix apps/api ci

      - name: Lint API
        run: npm --prefix apps/api run lint

      - name: Test API
        run: npm --prefix apps/api run test:e2e -- --runInBand

      - name: Build API
        run: npm --prefix apps/api run build

      - name: Install admin dependencies
        run: npm --prefix apps/admin ci

      - name: Lint admin
        run: npm --prefix apps/admin run lint

      - name: Build admin
        run: npm --prefix apps/admin run build

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Lint web
        run: npm --prefix apps/web run lint

      - name: Build web
        run: npm --prefix apps/web run build

      - name: Create production RC compose env
        run: |
          mkdir -p .codex-run
          cat > .codex-run/.env.production.test <<'EOF'
          NODE_ENV=production
          STUDIO_DOMAIN=studio-rc.local
          ADMIN_DOMAIN=admin.studio-rc.local
          NEXT_PUBLIC_SITE_URL=https://studio-rc.local
          NEXT_PUBLIC_API_URL=/api/v1
          API_INTERNAL_URL=http://api:4000/api/v1
          MONGO_ROOT_USERNAME=studio_root
          MONGO_ROOT_PASSWORD=rc-root-password-64-characters-long-for-ci-only
          MONGO_APP_USERNAME=studio_app
          MONGO_APP_PASSWORD=rc-app-password-64-characters-long-for-ci-only
          MONGO_DATABASE=studio
          MONGO_HOST=mongodb
          MONGO_PORT=27017
          MONGO_AUTH_SOURCE=studio
          JWT_ACCESS_SECRET=rc-access-secret-64-characters-long-for-ci-only
          JWT_REFRESH_SECRET=rc-refresh-secret-64-characters-long-for-ci-only
          JWT_ACCESS_TTL=15m
          JWT_REFRESH_TTL=30d
          ADMIN_SEED_NAME=Studio Admin
          ADMIN_SEED_EMAIL=admin@studio.local
          ADMIN_SEED_PASSWORD=rc-admin-password-64-characters-long-for-ci-only
          STUDIO_TIMEZONE=Asia/Ho_Chi_Minh
          CORS_ORIGINS=https://studio-rc.local,https://admin.studio-rc.local
          UPLOAD_DIR=/app/uploads
          MAX_UPLOAD_MB=25
          MAX_UPLOAD_FILES=20
          MEDIA_URL_PREFIX=/uploads
          COOKIE_SECURE=true
          TRUST_PROXY=true
          SWAGGER_ENABLED=false
          SERVE_UPLOADS=false
          BACKUP_RETENTION_DAYS=14
          BACKUP_INTERVAL_SECONDS=86400
          CERTBOT_EMAIL=admin@studio-rc.local
          CERTBOT_IMAGE=certbot/certbot:v2.11.0
          EOF

      - name: Validate production compose
        run: docker compose --env-file .codex-run/.env.production.test -f docker-compose.prod.yml config

      - name: Build production images
        run: docker compose --env-file .codex-run/.env.production.test -f docker-compose.prod.yml build

      - name: Stop MongoDB
        if: always()
        run: docker compose stop mongodb
