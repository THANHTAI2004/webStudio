x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: "4000"
  MONGO_HOST: mongodb
  MONGO_PORT: "27017"
  MONGO_DATABASE: ${MONGO_DATABASE}
  MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
  MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
  MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
  CORS_ORIGINS: ${CORS_ORIGINS}
  STUDIO_TIMEZONE: ${STUDIO_TIMEZONE:-Asia/Ho_Chi_Minh}
  UPLOAD_DIR: /app/uploads
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-20}
  MEDIA_URL_PREFIX: /uploads
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  SERVE_UPLOADS: ${SERVE_UPLOADS:-false}

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - studio_db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *api-environment
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-Studio Admin}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@studio.local}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
    volumes:
      - ./data/uploads:/app/uploads
    networks:
      - studio_edge
      - studio_db
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        API_INTERNAL_URL: http://api:4000/api/v1
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      API_INTERNAL_URL: http://api:4000/api/v1
    networks:
      - studio_edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    networks:
      - studio_edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      STUDIO_DOMAIN: ${STUDIO_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/uploads:/srv/uploads:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./infrastructure/nginx/ssl:/etc/letsencrypt:ro
    networks:
      - studio_edge
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/healthz >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backup:
    build:
      context: ./infrastructure/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: ${STUDIO_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - ./data/uploads:/uploads:ro
      - ./data/backups:/backups
    networks:
      - studio_db
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:

networks:
  studio_edge:
  studio_db:
    internal: true
